{{- if .Values.ollama.enabled }}
{{/*
  The model runtime: the second workload in this release.

  It is a separate Deployment rather than a sidecar because its lifecycle is
  nothing like the portal's — a multi-gigabyte image, minutes to become ready
  while a model loads, and storage that must survive a web deploy. As a sidecar,
  every portal restart would re-load the model; as its own Deployment, the
  portal can be upgraded a dozen times and the model stays warm.

  One replica: model files are on a ReadWriteOnce volume and two pods cannot
  share it. Scaling this means either a shared read-only model volume or one
  volume per replica — both are real options, neither belongs in a default.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "config-portal.ollamaName" . }}
  labels:
    {{- include "config-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate          # one volume, so the old pod must go first
  selector:
    matchLabels:
      {{- include "config-portal.ollamaSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "config-portal.ollamaSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ollama.podSecurityContext | nindent 8 }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.ollama.securityContext | nindent 12 }}
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ .Values.ollama.service.port }}"
            # Keep the model resident: loading a 3B model takes seconds, and a
            # dashboard question should not pay for it every time.
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          ports:
            - name: http
              containerPort: {{ .Values.ollama.service.port }}
          # /api/tags answers as soon as the server is up, before any model is
          # loaded — which is what readiness should mean here. A pull in progress
          # must not take the service out.
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/tags, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "config-portal.ollamaName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "config-portal.ollamaName" . }}
  labels:
    {{- include "config-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-runtime
spec:
  type: {{ .Values.ollama.service.type }}
  selector:
    {{- include "config-portal.ollamaSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: http
{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "config-portal.ollamaName" . }}
  labels:
    {{- include "config-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-runtime
  annotations:
    # Models are big and slow to fetch; keeping the volume means an uninstall
    # and reinstall does not re-download gigabytes.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.ollama.persistence.accessMode }}]
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
{{- if .Values.ollama.pullOnInstall }}
---
{{/*
  Pull the model once, after the service exists, as a Helm hook.

  A Job rather than an init container: an init container would re-pull on every
  pod restart and block the runtime from starting, while a hook runs once per
  install or upgrade and leaves the Deployment free to come up immediately. It
  is deliberately tolerant — if the pull fails the assistant still works, it
  just downloads on first use, so a slow registry does not fail the release.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "config-portal.ollamaName" . }}-pull
  labels:
    {{- include "config-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-pull
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # NOT hook-succeeded: a pull that "succeeds" without pulling is exactly the
    # failure worth reading afterwards, and deleting the pod takes its log with
    # it. ttlSecondsAfterFinished below cleans up on its own timetable.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "config-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: model-pull
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pull
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          # `ollama pull` against the running service, not this pod's own daemon
          env:
            - name: OLLAMA_HOST
              value: "http://{{ include "config-portal.ollamaName" . }}:{{ .Values.ollama.service.port }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              # `ollama list` is the readiness check, not curl: the upstream
              # image ships no curl, and an absent binary made this loop spin
              # for five minutes and then report success without pulling
              # anything. The CLI is guaranteed present and talks to
              # $OLLAMA_HOST, so it tests the same thing more honestly.
              echo "waiting for the model runtime at $OLLAMA_HOST"
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "the runtime never answered after 5 minutes."
                  echo "the model will be pulled on first use instead."
                  exit 0
                fi
                sleep 5
              done
              echo "runtime is up. pulling {{ .Values.ollama.model }} —"
              echo "a few gigabytes, so this can take several minutes."
              if ollama pull {{ .Values.ollama.model | quote }}; then
                echo "pulled. models now available:"
                ollama list
              else
                echo "the pull failed. the assistant still works: the model is"
                echo "fetched on first use, the first answer is just slower."
                exit 0
              fi
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
{{- end }}
{{- end }}
