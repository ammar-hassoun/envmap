{{/* Held as a Secret rather than a ConfigMap because branding is harmless but
     this is the natural home for anything else a deployment adds, and the
     Deployment hashes it to roll the pod when it changes. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "config-portal.fullname" . }}-env
  labels: {{- include "config-portal.labels" . | nindent 4 }}
type: Opaque
{{/* data with b64enc, not stringData, and the difference is not cosmetic.

     stringData is write-only: Kubernetes folds it into data and the stored
     object never has a stringData field at all. Helm's three-way merge then
     compares a manifest that sets stringData against a live object that has
     only data, so it can see keys being ADDED but never keys being REMOVED —
     nothing it manages ever disappears. Unset a value in values.yaml, run
     helm upgrade, and the old one is still in the Secret and still in the pod.

     For this chart that meant a stored value could not be withdrawn, an update
     URL could not be turned off, and PORTAL_SECRET_KEY could not be rotated
     back to "generate a file instead" — all silently, with a successful
     upgrade and a rendered manifest that correctly showed the key gone.
     Encoding into data ourselves puts Helm's managed field and Kubernetes'
     stored field in the same place, and removal works. */}}
data:
  PORTAL_SESSION_HOURS: {{ .Values.portal.sessionHours | toString | b64enc | quote }}
  PORTAL_COOKIE_SECURE: {{ ternary "1" "0" (or .Values.portal.cookieSecure (and .Values.ingress.enabled (gt (len .Values.ingress.tls) 0))) | b64enc | quote }}
  {{/* The assistant's defaults. The portal treats these as a starting point:
       anything saved in Settings wins, so a chart upgrade never overwrites a
       deliberate choice — and an operator who switches to a hosted model does
       not have to fight the chart. */}}
  {{- if .Values.portal.secretKey }}
  {{- /* encrypts stored credentials. Kept here so the key lives in a Secret
         and the database on a volume — a leaked volume is then not a leaked
         credential. Unset, the portal generates a key file next to the
         database, which is weaker but needs no configuration. */}}
  PORTAL_SECRET_KEY: {{ .Values.portal.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.updateUrl }}
  PORTAL_UPDATE_URL: {{ .Values.updateUrl | b64enc | quote }}
  {{- end }}
  PORTAL_ASSISTANT_ENABLED: {{ ternary "1" "0" .Values.assistant.enabled | b64enc | quote }}
  PORTAL_ASSISTANT_PROVIDER: {{ .Values.assistant.provider | b64enc | quote }}
  PORTAL_ASSISTANT_URL: {{ include "config-portal.assistantUrl" . | b64enc | quote }}
  PORTAL_ASSISTANT_MODEL: {{ (default .Values.ollama.model .Values.assistant.model) | b64enc | quote }}
