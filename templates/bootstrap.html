{% extends "_auth_shell.html" %}
{% block body %}
<h1>Create the first administrator</h1>
<p class="sub">No accounts exist yet. This one becomes an admin and can invite others.</p>
{% if err %}<div class="err">⚠ {{ err }}</div>{% endif %}
<form method="post" action="/bootstrap">
  <label class="f" for="email">Email (this is your username)</label>
  <input type="email" id="email" name="email" required autofocus
         placeholder="you@example.com" autocomplete="username">
  <label class="f" for="name">Full name (used as your git commit author)</label>
  <input type="text" id="name" name="name" placeholder="your full name" autocomplete="name">
  <label class="f" for="password">Password</label>
  <input type="password" id="password" name="password" required
         placeholder="at least 10 chars, mixed case, a digit" autocomplete="new-password">
  <label class="f" for="password2">Confirm password</label>
  <input type="password" id="password2" name="password2" required autocomplete="new-password">
  <button type="submit">Create account &amp; set up MFA</button>
</form>
<div class="note">Google Authenticator enrolment is required on the next screen.</div>
{% endblock %}
